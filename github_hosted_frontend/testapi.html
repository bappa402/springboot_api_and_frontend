<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BMI Calculator</title>
    <style>
        /* Spinner & Loading Styles */
        .loading-container {
            display: none;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            color: #555;
            margin-top: 15px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            border-top-color: #333;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <h2>BMI Calculator</h2>

    <form id="bmiForm">
        <p>
            <label for="weight">Weight (kg):</label><br>
            <input type="number" id="weight" step="0.1" required>
        </p>
        <p>
            <label for="height">Height (meters):</label><br>
            <input type="number" id="height" step="0.01" required>
        </p>
        <p>
            <button type="submit" id="submitBtn">Calculate</button>
        </p>
    </form>

    <!-- Loading Indicator -->
    <div id="loading" class="loading-container">
        <span class="spinner"></span>
        <span>Connecting to server...</span>
    </div>

    <p id="error" style="color: red;"></p>

    <div id="result" style="display: none;">
        <h3>Result</h3>
        <p>BMI: <span id="bmiVal"></span></p>
        <p>Body Type: <span id="typeVal"></span></p>
    </div>

    <script>
        document.getElementById('bmiForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const weight = document.getElementById('weight').value;
            const height = document.getElementById('height').value;
            const errorP = document.getElementById('error');
            const resultDiv = document.getElementById('result');
            const loadingDiv = document.getElementById('loading');
            const submitBtn = document.getElementById('submitBtn');

            // Reset UI states
            errorP.textContent = '';
            resultDiv.style.display = 'none';

            // Show loading state and disable submit button
            loadingDiv.style.display = 'flex';
            submitBtn.disabled = true;

            try {
                const response = await fetch(`https://bain-spring-boot-api.onrender.com/api/bmi?weight=${weight}&height=${height}`);

                if (!response.ok) {
                    throw new Error('Calculation failed. Check your inputs.');
                }

                const data = await response.json();

                document.getElementById('bmiVal').textContent = data.bmi;
                document.getElementById('typeVal').textContent = data.bodyType;
                resultDiv.style.display = 'block';

            } catch (err) {
                errorP.textContent = 'Error: Could not connect to backend.';
            } finally {
                // Hide loading state and re-enable button when request finishes
                loadingDiv.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
